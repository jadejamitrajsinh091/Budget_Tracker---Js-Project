<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Tracker System</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container py-5 d-flex justify-content-center">
    <div class="tracker-card card border-0 shadow p-4 p-md-5">
      <h2 class="text-center tracker-title mb-4">Budget Tracker System</h2>

      <div class="row g-4">
   
        <div class="col-12 col-md-4 d-flex flex-column gap-3">

          <div class="card p-3 border">
            <h6 class="fw-bold text-secondary mb-3">Add Budget</h6>
            <div class="mb-3">
              <label for="budgetInput" class="form-label small text-muted">Budget:</label>
              <input
                type="number"
                class="form-control form-control-sm"
                id="budgetInput"
                placeholder="Enter budget"
                min="0"
              />
            </div>
            <button class="btn btn-primary btn-sm w-100" id="addBudgetBtn">
              Add Budget
            </button>
          </div>

  
          <div class="card p-3 border">
            <h6 class="fw-bold text-secondary mb-3">Add Expense</h6>
            <div class="mb-3">
              <label for="expenseTitleInput" class="form-label small text-muted">Expense Title:</label>
              <input
                type="text"
                class="form-control form-control-sm"
                id="expenseTitleInput"
                placeholder="For Example 'Milk'"
              />
            </div>
            <div class="mb-3">
              <label for="expenseAmountInput" class="form-label small text-muted">Amount:</label>
              <input
                type="number"
                class="form-control form-control-sm"
                id="expenseAmountInput"
                placeholder="Enter amount"
                min="0"
              />
            </div>
            <button class="btn btn-primary btn-sm w-100" id="addExpenseBtn">
              Add Expense
            </button>
          </div>


          <button class="btn btn-danger btn-sm w-100" id="resetAllBtn">
            Reset All
          </button>
        </div>


        <div class="col-12 col-md-8">
          <div class="card p-3 border h-100 d-flex flex-column gap-3">

            <div class="row g-2 text-center">
              <div class="col-4">
                <div class="stat-box p-2 rounded small fw-semibold text-primary">
                  Total Budget: <span id="totalBudgetDisplay">0.00</span>
                </div>
              </div>
              <div class="col-4">
                <div class="stat-box p-2 rounded small fw-semibold text-primary">
                  Total Expenses: <span id="totalExpensesDisplay">0.00</span>
                </div>
              </div>
              <div class="col-4">
                <div class="stat-box p-2 rounded small fw-semibold text-primary">
                  Budget Left: <span id="budgetLeftDisplay">0.00</span>
                </div>
              </div>
            </div>


            <div class="flex-grow-1">
              <h6 class="fw-bold text-secondary mb-3">Expense History:</h6>
              <div class="table-responsive">
                <table class="table align-middle">
                  <thead>
                    <tr class="text-secondary small">
                      <th scope="col">Expense Name</th>
                      <th scope="col">Amount</th>
                      <th scope="col" class="text-end">Action</th>
                    </tr>
                  </thead>
                  <tbody id="expenseTableBody">
                     
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
